tokenizer:
  type: byte_bpe
  vocab_size: 512
  min_frequency: 2
  special_tokens:
    - "<|character|>"
    - "<|relationship|>"
    - "<|scene|>"
    - "<|world_facts|>"
    - "<|memories|>"
    - "<|conversation|>"
    - "<|user|>"
    - "<|assistant|>"
    - "<|end|>"

model:
  name: transformer
  position_encoding: rope
  normalization: layernorm
  feed_forward_activation: swiglu
  embedding_dim: 192
  attention_heads: 6
  layers: 6
  feed_forward_dim: 768
  dropout: 0.1

data:
  type: character_jsonl
  train_path: data/character/processed/train.jsonl
  val_path: data/character/processed/val.jsonl
  manifest_path: data/character/processed/manifest.json
  block_size: 2048
  batch_size: 1

train:
  seed: 1337
  learning_rate: 5.0e-5
  min_learning_rate: 5.0e-6
  warmup_steps: 100
  max_steps: 5000
  gradient_accumulation_steps: 4
  gradient_clip: 1.0
  weight_decay: 0.01
  log_interval: 25
  eval_interval: 100
  eval_iters: 50
  early_stopping_patience: 5
  device: auto

checkpoint:
  dir: checkpoints/transformer_character_finetune
  save_interval: 500
