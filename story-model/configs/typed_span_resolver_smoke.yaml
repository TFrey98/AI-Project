tokenizer:
  type: byte_bpe
  vocab_size: 512
  min_frequency: 2
  special_tokens:
    - "<|character|>"
    - "<|relationship|>"
    - "<|scene|>"
    - "<|world_facts|>"
    - "<|memories|>"
    - "<|conversation|>"
    - "<|user|>"
    - "<|assistant|>"
    - "<|end|>"
    - "<|resolver|>"
    - "<|candidate|>"
    - "<|decision|>"
    - "<|resolved_value|>"

model:
  name: transformer
  position_encoding: rope
  normalization: layernorm
  feed_forward_activation: swiglu
  embedding_dim: 384
  attention_heads: 6
  layers: 8
  feed_forward_dim: 1024
  dropout: 0.1

data:
  type: typed_span_resolver
  train_path: data/character/typed_span_resolver/train.jsonl
  val_path: data/character/typed_span_resolver/val.jsonl
  manifest_path: data/character/typed_span_resolver/manifest.json
  block_size: 1024
  batch_size: 4

train:
  seed: 1337
  learning_rate: 5.0e-5
  min_learning_rate: 5.0e-6
  warmup_steps: 25
  max_steps: 100
  gradient_accumulation_steps: 2
  gradient_clip: 1.0
  weight_decay: 0.01
  log_interval: 10
  eval_interval: 25
  eval_batches: 10
  early_stopping_patience: 8
  device: auto

checkpoint:
  dir: checkpoints/typed_span_resolver_smoke
  save_interval: 25
