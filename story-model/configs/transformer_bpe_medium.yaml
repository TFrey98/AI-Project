tokenizer:
  type: byte_bpe
  vocab_size: 512
  min_frequency: 2

model:
  name: transformer
  position_encoding: rope
  normalization: layernorm
  feed_forward_activation: swiglu
  embedding_dim: 192
  attention_heads: 6
  layers: 6
  feed_forward_dim: 768
  dropout: 0.1

data:
  train_path: data/processed/train.txt
  val_path: data/processed/val.txt
  manifest_path: data/processed/manifest.json
  block_size: 256
  batch_size: 16

train:
  seed: 1337
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  max_steps: 10000
  gradient_clip: 1.0
  weight_decay: 0.01
  log_interval: 100
  eval_interval: 500
  eval_iters: 200
  device: auto

checkpoint:
  dir: checkpoints/transformer_bpe_medium
  save_interval: 1000
