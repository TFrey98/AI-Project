tokenizer:
  type: byte_bpe
  vocab_size: 512
  min_frequency: 2
  # Phase 24 must be launched with --tokenizer-from foundation-v2 so
  # capacity/context change without changing the established token ids.
  special_tokens: []

model:
  name: transformer
  position_encoding: rope
  normalization: layernorm
  feed_forward_activation: swiglu
  embedding_dim: 384
  attention_heads: 6
  layers: 8
  feed_forward_dim: 1024
  dropout: 0.1

data:
  train_path: data/processed_v2/train.txt
  val_path: data/processed_v2/val.txt
  manifest_path: data/processed_v2/manifest.json
  # Preserve 4,096 sampled tokens/update while doubling useful context.
  block_size: 512
  batch_size: 8

train:
  seed: 1337
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 1000
  max_steps: 30000
  gradient_clip: 1.0
  weight_decay: 0.01
  log_interval: 100
  eval_interval: 1000
  eval_iters: 200
  early_stopping_patience: 6
  device: auto

checkpoint:
  dir: checkpoints/transformer_foundation_v3
  save_interval: 2000
