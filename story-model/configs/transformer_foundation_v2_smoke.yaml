tokenizer:
  type: byte_bpe
  vocab_size: 512
  min_frequency: 2
  special_tokens: []

model:
  name: transformer
  position_encoding: rope
  normalization: layernorm
  feed_forward_activation: swiglu
  embedding_dim: 192
  attention_heads: 6
  layers: 6
  feed_forward_dim: 768
  dropout: 0.1

data:
  train_path: data/processed_v2/train.txt
  val_path: data/processed_v2/val.txt
  manifest_path: data/processed_v2/manifest.json
  block_size: 256
  batch_size: 16

train:
  seed: 1337
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-5
  warmup_steps: 20
  max_steps: 200
  gradient_clip: 1.0
  weight_decay: 0.01
  log_interval: 50
  eval_interval: 50
  eval_iters: 20
  device: auto

checkpoint:
  dir: checkpoints/transformer_foundation_v2_smoke
  save_interval: 100
