tokenizer:
  type: byte_bpe
  vocab_size: 512
  min_frequency: 2
  special_tokens: []

model:
  name: transformer
  position_encoding: rope
  normalization: layernorm
  feed_forward_activation: swiglu
  embedding_dim: 384
  attention_heads: 6
  layers: 8
  feed_forward_dim: 1024
  dropout: 0.1

data:
  train_path: data/processed_v2/train.txt
  val_path: data/processed_v2/val.txt
  manifest_path: data/processed_v2/manifest.json
  block_size: 512
  batch_size: 8

train:
  seed: 1337
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  max_steps: 2000
  gradient_clip: 1.0
  weight_decay: 0.01
  log_interval: 100
  eval_interval: 250
  eval_iters: 100
  device: auto

checkpoint:
  dir: checkpoints/transformer_foundation_v3_pilot
  save_interval: 500
