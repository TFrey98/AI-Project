model:
  name: transformer
  position_encoding: rope
  normalization: layernorm
  feed_forward_activation: gelu
  embedding_dim: 128
  attention_heads: 4
  layers: 4
  feed_forward_dim: 512
  dropout: 0.1

data:
  path: data/input.txt
  train_split: 0.9
  block_size: 128
  batch_size: 16

train:
  seed: 1337
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 20
  max_steps: 200
  gradient_clip: 1.0
  weight_decay: 0.01
  log_interval: 50
  eval_interval: 50
  eval_iters: 20
  device: auto

checkpoint:
  dir: checkpoints/transformer_rope_gelu_matched_smoke
  save_interval: 100